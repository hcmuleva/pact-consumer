
# FILE: .github/workflows/consumer-main.yml
name: Consumer - Main Branch

on:
  push:
    branches: [main]

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_BASIC_AUTH_USERNAME }}
  PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_BASIC_AUTH_PASSWORD }}

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Run Pact tests
        run: npm run test:pact

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish Pact to Broker
        run: |
          npx pact-broker publish \
            ./pacts \
            --consumer-app-version=${{ steps.package-version.outputs.version }} \
            --branch=main \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }} \
            --tag=main \
            --tag=production \
            --build-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Can I deploy to production?
        id: can-i-deploy
        continue-on-error: true
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant=ConsumerApp \
            --version=${{ steps.package-version.outputs.version }} \
            --to-environment=production \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }} \
            --retry-while-unknown=60 \
            --retry-interval=10

      - name: Record deployment
        if: steps.can-i-deploy.outcome == 'success'
        run: |
          npx pact-broker record-deployment \
            --pacticipant=ConsumerApp \
            --version=${{ steps.package-version.outputs.version }} \
            --environment=production \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }}

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release